[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eristavi-lang"
version = "0.0.1.dev0"
description = "Bootstrap implementation of the Eristavi programming language"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
erist = "compiler.erist.cli:main"

[tool.setuptools.packages.find]
include = ["compiler*"]
