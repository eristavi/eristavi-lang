name: U2 nested primary native composition focused
on:
  push:
    branches: [compiler/u2-nested-primary-20261107]
    paths:
      - src/compiler/u2_function_managed_x86_64.eri
      - tests/fixtures/u2_function_file_nested_primary.eri
      - tests/test_u2_function_file_primary.py
      - .github/workflows/u2-nested-primary-focused.yml
permissions:
  contents: read
concurrency:
  group: u2-nested-primary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m compileall -q compiler tests/test_u2_function_file_primary.py
      - name: Confirm nested and single-owner primary composition
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=tests:. python -u -m unittest -v \
            test_u2_function_file_primary.U2FunctionFilePrimaryTests.test_nested_close_failure_becomes_primary_through_outer_cleanup \
            test_u2_function_file_primary.U2FunctionFilePrimaryTests.test_generated_primary_preservation_and_secondary_append \
            test_u2_function_file_checked.U2FunctionFileCheckedTests.test_nested_lexical_file_owners_and_recovering_handlers \
            2>&1 | tee "$RUNNER_TEMP/nested-primary.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: u2-nested-primary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nested-primary.log
          retention-days: 14
