name: U2 whole-Function managed root and GC focused checks
on:
  push:
    branches: [compiler/u2-cleanup-foundation-20261102]
    paths:
      - src/compiler/u2_function_managed_x86_64.eri
      - src/compiler/u2_function_contract.eri
      - src/compiler/u2_ssa_liveness.eri
      - src/compiler/u1_words.eri
      - src/compiler/u2_managed_root_gate.eri
      - src/compiler/u1_builder.eri
      - src/compiler/u1_ops.eri
      - src/compiler/u1_verify.eri
      - tests/fixtures/u2_function_managed_cfg.eri
      - tests/fixtures/u2_function_managed_recursive.eri
      - tests/fixtures/u2_function_managed_recursive_reference.eri
      - tests/fixtures/u2_function_checked_recursive.eri
      - tests/fixtures/u2_function_checked_recursive_reference.eri
      - tests/test_u2_function_managed_native.py
      - tests/test_u2_function_checked_native.py
      - tests/test_u2_function_checked_group.py
      - tests/fixtures/u2_function_checked_mutual.eri
      - tests/fixtures/u2_function_checked_mutual_reference.eri
      - tests/fixtures/u2_function_checked_group_direct.eri
      - .github/workflows/u2-function-managed-focused.yml
permissions:
  contents: read
concurrency:
  group: u2-function-managed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  managed-function:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install compiler bootstrap
        run: python -m pip install -e .
      - name: Compile Python tests and compiler
        run: python -m compileall -q tests/test_u2_function_managed_native.py tests/test_u2_function_checked_native.py tests/test_u2_function_checked_group.py compiler
      - name: Check original U1a exact radix backing and refusal work accounting
        run: |
          set -o pipefail
          PYTHONPATH=tests python -u -m unittest -v test_u1_words_path 2>&1 | tee "$RUNNER_TEMP/u1a-word-path.log"
      - name: Run physical owned-runtime managed Function tests
        run: |
          set -o pipefail
          PYTHONPATH=tests python -u -m unittest -v test_u2_function_managed_native test_u2_function_checked_native test_u2_function_checked_group 2>&1 | tee "$RUNNER_TEMP/u2-managed-function.log"
      - name: Preserve managed Function logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: u2-managed-function-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/u2-managed-function.log
            ${{ runner.temp }}/u1a-word-path.log
