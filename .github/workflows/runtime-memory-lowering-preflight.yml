name: Private memory lowering preflight

on:
  push:
    branches: [runtime/private-memory-lowering-x86]

concurrency:
  group: private-memory-lowering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bootstrap toolchain
        run: python -m pip install -e .
      - name: Compile focused tests
        run: python -m py_compile tests/test_freestanding_foundation.py tests/test_internal_memory_allocator.py tests/test_runtime_memory_lowering.py
      - name: Run focused runtime independence tests
        run: python -m unittest -v tests.test_freestanding_foundation tests.test_internal_memory_allocator tests.test_runtime_memory_lowering
