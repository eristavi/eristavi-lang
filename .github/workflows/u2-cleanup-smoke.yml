name: U2 native cleanup focused checks
on:
  push:
    branches: [compiler/u2-cleanup-foundation-20261102]
    paths:
      - src/compiler/u2_cleanup_native_x86_64.eri
      - src/compiler/u2_cleanup_canonical_x86_64.eri
      - src/compiler/u2_checked_rooted_x86_64.eri
      - src/compiler/u2_checked_ssa_bind.eri
      - src/compiler/u2_checked_chain_verify.eri
      - src/compiler/u2_checked_ssa_x86_64.eri
      - tests/fixtures/u2_checked_ssa.eri
      - tests/test_u2_checked_ssa.py
      - tests/test_u2_checked_ssa_prefix.py
      - tests/test_u2_recursive_native_cleanup.py
      - tests/fixtures/u2_checked_ssa_prefix.eri
      - tests/test_u2_checked_rooted.py
      - tests/test_u2_native_cleanup.py
      - tests/fixtures/u2_cleanup_native.eri
      - .github/workflows/u2-cleanup-smoke.yml
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install compiler bootstrap
        run: python -m pip install -e .
      - name: Validate native checked cleanup
        run: PYTHONPATH=tests python -u -m unittest -v test_u2_native_cleanup test_u2_checked_rooted test_u2_checked_ssa test_u2_checked_ssa_prefix test_u2_recursive_native_cleanup
