name: U2 File-root fix focused checks
on:
  push:
    branches: [compiler/u2-whole-function-file-roots-20261107]
    paths:
      - tests/test_u2_function_file_roots.py
      - .github/workflows/u2-file-root-fix-focused.yml
permissions:
  contents: read
concurrency:
  group: u2-file-root-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: File owner roots
            tests: test_u2_function_file_roots
          - name: Generator parity watchdogs
            tests: test_u2_function_checked_native.U2FunctionCheckedNativeTests.test_owned_and_c_bootstrap_generators_emit_identical_checked_function test_u2_function_checked_group.U2FunctionCheckedGroupTests.test_owned_and_c_generators_agree_on_direct_group
    name: ${{ matrix.name }}
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run requested focused regressions
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=tests:. python -u -m unittest -v ${{ matrix.tests }} 2>&1 | tee "$RUNNER_TEMP/focused.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: u2-file-root-fix-${{ strategy.job-index }}
          path: ${{ runner.temp }}/focused.log
          retention-days: 14
