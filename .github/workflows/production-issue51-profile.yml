name: Production compiler #51 counters (opt-in branch probe)

# One bounded diagnostic only; never runs the full CI or an owned B->C self-build.
on:
  pull_request:
    paths:
      - tools/probes/production_issue51_profile.py
      - .github/workflows/production-issue51-profile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue51-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  production-profile:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'perf/issue51-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Validate profiler syntax and base decoder
        run: |
          python -m py_compile tools/probes/production_issue51_profile.py
          PYTHONPATH=tests python -m unittest -v test_u1b_profile_decoder
      - name: Bounded C-bootstrap to owned B compiler source-probe
        shell: bash
        run: |
          set -o pipefail
          python -u tools/probes/production_issue51_profile.py \
            --output issue51-profile --cap 90 2>&1 | tee issue51-profile.log
      - name: Retain complete counter and timeout evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue51-profile-${{ github.run_attempt }}
          retention-days: 14
          path: |
            issue51-profile/
            issue51-profile.log
