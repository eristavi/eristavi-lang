name: U2 identity-root admission focused checks
on:
  push:
    branches: [compiler/u2-cleanup-foundation-20261102]
    paths:
      - src/compiler/u2_identity_root_gate.eri
      - src/compiler/u2_managed_types.eri
      - src/compiler/u2_ssa_liveness.eri
      - tests/test_u2_identity_root_gate.py
      - src/compiler/u2_identity_root_x86_64.eri
      - tests/test_u2_identity_native_publication.py
      - src/compiler/u2_checked_ssa_bind.eri
      - tests/fixtures/u2_checked_identity_ssa.eri
      - tests/test_u2_checked_identity_ssa.py
      - tests/test_u2_identity_gc_cleanup.py
      - tests/test_u2_identity_file_cleanup.py
      - .github/workflows/u2-identity-focused.yml
permissions:
  contents: read
concurrency:
  group: u2-identity-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install compiler bootstrap
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q tests compiler
      - name: Run focused identity SSA and owned-runtime tests
        run: |
          set -o pipefail
          PYTHONPATH=tests python -u -m unittest -v test_u2_identity_root_gate test_u2_identity_gc_cleanup test_u2_identity_file_cleanup test_u2_identity_native_publication test_u2_checked_identity_ssa 2>&1 | tee "$RUNNER_TEMP/identity-results.log"
      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: identity-${{ github.run_attempt }}
          retention-days: 14
          path: ${{ runner.temp }}/identity-results.log
