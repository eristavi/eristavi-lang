name: Apply Universal verifier flow index

on:
  push:
    branches: [compiler/index-universal-verifier-flows]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
      CFLAGS: -O2
      PYTHONPATH: tests:.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bootstrap toolchain
        run: python -m pip install -e .
      - name: Freeze production source and build baseline
        run: |
          set -euo pipefail
          cp -a src "$RUNNER_TEMP/source-baseline"
          python -u tools/build_offline.py --skip-self-build --trace-phases --command-timeout 300 --output "$RUNNER_TEMP/baseline" > "$RUNNER_TEMP/baseline-build.log" 2>&1
      - name: Baseline full-source measurement
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$RUNNER_TEMP/baseline.time.txt" timeout --signal=TERM --kill-after=10s 180s \
            "$RUNNER_TEMP/baseline/bin/erist-compiler" emit-asm "$RUNNER_TEMP/source-baseline/frontend.eri" \
            --source-root "$RUNNER_TEMP/source-baseline" --target x86_64-linux --trace-phases \
            > "$RUNNER_TEMP/baseline.s" 2> "$RUNNER_TEMP/baseline.trace.log"
          sha256sum "$RUNNER_TEMP/baseline.s" > "$RUNNER_TEMP/baseline.sha256"
      - name: Apply candidate
        run: |
          set -euo pipefail
          python tools/apply_universal_flow_index.py
          git diff --check
          git diff -- src/compiler/universal_verify.eri > "$RUNNER_TEMP/candidate.patch"
          python -m compileall -q compiler tests tools
      - name: Focused verifier regressions
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_self_hosting_universal.SelfHostedUniversalTests.test_verifier_preserves_wide_cfg_diagnostics \
            tests.test_self_hosting_universal.SelfHostedUniversalTests.test_native_verifier_preserves_wide_cfg_diagnostics
      - name: Build candidate compiler
        run: |
          set -euo pipefail
          python -u tools/build_offline.py --skip-self-build --trace-phases --command-timeout 300 --output "$RUNNER_TEMP/candidate" > "$RUNNER_TEMP/candidate-build.log" 2>&1
      - name: Candidate full-source measurement and identity gate
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$RUNNER_TEMP/candidate.time.txt" timeout --signal=TERM --kill-after=10s 180s \
            "$RUNNER_TEMP/candidate/bin/erist-compiler" emit-asm "$RUNNER_TEMP/source-baseline/frontend.eri" \
            --source-root "$RUNNER_TEMP/source-baseline" --target x86_64-linux --trace-phases \
            > "$RUNNER_TEMP/candidate.s" 2> "$RUNNER_TEMP/candidate.trace.log"
          sha256sum "$RUNNER_TEMP/candidate.s" > "$RUNNER_TEMP/candidate.sha256"
          test "$(sha256sum "$RUNNER_TEMP/baseline.s" | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/candidate.s" | awk '{print $1}')"
          echo '--- baseline ---'; cat "$RUNNER_TEMP/baseline.time.txt"
          echo '--- candidate ---'; cat "$RUNNER_TEMP/candidate.time.txt"
          echo '--- hashes ---'; cat "$RUNNER_TEMP/baseline.sha256" "$RUNNER_TEMP/candidate.sha256"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: universal-flow-index-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/baseline-build.log
            ${{ runner.temp }}/candidate-build.log
            ${{ runner.temp }}/baseline.trace.log
            ${{ runner.temp }}/candidate.trace.log
            ${{ runner.temp }}/baseline.time.txt
            ${{ runner.temp }}/candidate.time.txt
            ${{ runner.temp }}/baseline.sha256
            ${{ runner.temp }}/candidate.sha256
      - name: Commit validated production change only
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/universal_verify.eri
          git rm tools/apply_universal_flow_index.py .github/workflows/apply-universal-flow-index.yml
          git commit -m 'Index Universal verifier flow lookups'
          git push
