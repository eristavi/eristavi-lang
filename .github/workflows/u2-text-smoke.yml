name: U2 Text focused native checks
on:
  push:
    branches: [compiler/u2-cleanup-foundation-20261102]
    paths:
      - src/compiler/u2_text_native.eri
      - tests/test_u2_text_unicode17.py
      - tests/fixtures/u2_text_unicode17.eri
      - .github/workflows/u2-text-smoke.yml
permissions:
  contents: read
concurrency:
  group: u2-text-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  text:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install compiler bootstrap
        run: python -m pip install -e .
      - name: Validate focused Unicode 17 Text execution
        run: PYTHONPATH=tests python -u -m unittest -v test_u2_text_unicode17
