name: Runtime memory preflight

on:
  push:
    branches: [runtime/internal-memory-layout-allocator]

concurrency:
  group: runtime-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bootstrap toolchain
        run: python -m pip install -e .
      - name: Compile changed Python test
        run: python -m py_compile tests/test_internal_memory_allocator.py tests/test_freestanding_foundation.py
      - name: Run focused freestanding probes
        run: python -m unittest -v tests.test_freestanding_foundation tests.test_internal_memory_allocator
