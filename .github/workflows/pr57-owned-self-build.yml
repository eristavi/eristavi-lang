name: PR57 owned self-build diagnostic
on:
  push:
    branches: [diagnostics/pr57-owned-self-build]
permissions:
  contents: read
jobs:
  owned-self-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8af0ffe3350c737550c3ab0e6c3fa89f60f6f091
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = 8af0ffe3350c737550c3ab0e6c3fa89f60f6f091
          test -z "$(git status --porcelain)"
      - name: Install bootstrap toolchain
        run: python -m pip install -e .
      - name: One owned self-build qualification with 900-second command boundary
        run: |
          set -o pipefail
          python -u - <<'PY' 2>&1 | tee "$RUNNER_TEMP/pr57-owned-self-build.log"
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          import build_offline
          from build_events import BuildJournal
          output = Path(os.environ['RUNNER_TEMP']) / 'pr57-owned-self'
          original = BuildJournal.run
          def timed(self, args, **kwargs):
              values = list(map(str, args))
              if len(values) > 1 and values[1] == 'emit-asm' and Path(values[0]) == output / 'bin/erist-compiler':
                  metrics = output / 'evidence' / ('owned-emit-' + str(self.number + 1) + '.time.txt')
                  args = ['/usr/bin/time', '-v', '-o', str(metrics), *values]
              return original(self, args, **kwargs)
          BuildJournal.run = timed
          build_offline.build(output, runtime_profile='owned', trace_phases=True, command_timeout=900)
          PY
      - name: Preserve all evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr57-owned-self-build
          retention-days: 14
          path: |
            ${{ runner.temp }}/pr57-owned-self-build.log
            ${{ runner.temp }}/pr57-owned-self/*.json
            ${{ runner.temp }}/pr57-owned-self/evidence/
