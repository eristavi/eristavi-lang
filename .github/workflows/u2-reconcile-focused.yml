name: U2 reconciliation bounded focused regression
on:
  push:
    branches: [compiler/u2-reconcile-111-121-20261111]
    paths:
      - src/compiler/u2_file_acquire_x86_64.eri
      - tests/fixtures/u2_file_acquire_native.eri
      - tests/test_u2_file_acquire_native.py
      - .github/workflows/u2-reconcile-focused.yml
permissions:
  contents: read
concurrency:
  group: u2-reconcile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    name: Existing File and bridge focused regressions only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned bootstrap dependencies
        run: python -m pip install -e .
      - name: Compile only Python test sources
        run: python -m compileall -q tests/test_u2_file_acquire_native.py compiler
      - name: Execute exact focused reconciliation tests
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=tests:. python -u -m unittest -v \
            test_u2_file_acquire_native.U2FileAcquireNativeTests \
            test_u2_function_file_checked.U2FunctionFileCheckedTests.test_generated_acquire_close_failure_handler_and_reclamation \
            test_u2_function_file_checked.U2FunctionFileCheckedTests.test_missing_roots_and_allocator_refusal_are_terminal \
            test_u2_function_file_value.U2FunctionFileValueTests.test_primary_values_and_nested_chain_preserve_context_and_aggregate \
            test_u2_function_file_value.U2FunctionFileValueTests.test_primary_values_refuse_bad_layout_and_cleanup_binding_without_leaks \
            test_u2_function_file_primary.U2FunctionFilePrimaryTests.test_generated_primary_preservation_and_secondary_append \
            test_u2_function_file_primary.U2FunctionFilePrimaryTests.test_primary_chain_keeps_outer_owner_and_ordered_context \
            test_u2_function_file_primary.U2FunctionFilePrimaryTests.test_other_file_member_failure_stays_primary_through_caller_cleanup \
            test_u2_function_file_primary.U2FunctionFilePrimaryTests.test_primary_group_assignments_refuse_foreign_missing_and_duplicate \
            test_u2_function_file_primary.U2FunctionFilePrimaryTests.test_live_primary_at_defined_call_still_refuses_before_output \
            2>&1 | tee "$RUNNER_TEMP/u2-reconcile-focused.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: u2-reconcile-${{ github.run_attempt }}
          retention-days: 14
          path: ${{ runner.temp }}/u2-reconcile-focused.log
