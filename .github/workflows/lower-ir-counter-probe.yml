name: Lower IR counter diagnostic

on:
  push:
    branches:
      - diagnostics/lower-ir-counts-ab3a606

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install bootstrap toolchain
        run: python -m pip install -e .

      - name: Freeze exact merged-main workload
        shell: bash
        run: |
          set -euo pipefail
          cp -a src "$RUNNER_TEMP/source-main"
          (cd "$RUNNER_TEMP/source-main" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/source-main.sha256"

      - name: Apply diagnostic-only lowering counters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          types_path=Path('src/compiler/ir_types.eri')
          s=types_path.read_text()
          s=s.replace(
              'import compiler.semantic;\n\npublic function register(program identity ir.Program, owner identity m.Module, value identity m.Type, location identity m.Location) returns Int fails m.SemanticError {\n'
              '    let actual be t.resolve(value); let kind be actual.kind;\n',
              'import compiler.semantic;\n\npublic type Profile { registerCalls Int; registerSteps Int; registerHits Int; registerMisses Int; maxTypes Int; }\n\n'
              'public function register(program identity ir.Program, owner identity m.Module, value identity m.Type, location identity m.Location, profile identity Profile) returns Int fails m.SemanticError {\n'
              '    profile.registerCalls=profile.registerCalls+1;\n'
              '    let actual be t.resolve(value); let kind be actual.kind;\n')
          s=s.replace(
              '    if kind == 7 or kind == 8 or kind == 9 { inner=try register(program,owner,t.inner(actual),location); }\n'
              '    let cursor be program.types; let index be 6;\n'
              '    while cursor != none { if cursor.kind == kind and cursor.name == actual.name and cursor.inner == inner { return cursor.index; } index=index+1; cursor=cursor.next; }\n'
              '    let item be identity ir.Type { index=index; kind=kind; name=actual.name; inner=inner; fields=none; checked=false; next=program.types; }; program.types=item;\n',
              '    if kind == 7 or kind == 8 or kind == 9 { inner=try register(program,owner,t.inner(actual),location,profile); }\n'
              '    let cursor be program.types; let index be 6;\n'
              '    while cursor != none {\n'
              '        profile.registerSteps=profile.registerSteps+1;\n'
              '        if cursor.kind == kind and cursor.name == actual.name and cursor.inner == inner { profile.registerHits=profile.registerHits+1; return cursor.index; }\n'
              '        index=index+1; cursor=cursor.next;\n'
              '    }\n'
              '    profile.registerMisses=profile.registerMisses+1; let typeCount be index-5; if typeCount > profile.maxTypes { profile.maxTypes=typeCount; }\n'
              '    let item be identity ir.Type { index=index; kind=kind; name=actual.name; inner=inner; fields=none; checked=false; next=program.types; }; program.types=item;\n')
          s=s.replace('let fieldType be try register(program,owner,field.value,location);','let fieldType be try register(program,owner,field.value,location,profile);')
          s=s.replace(
              'public function failures(program identity ir.Program, owner identity m.Module, names maybe identity m.Name, location identity m.Location) returns maybe identity ir.Failure fails m.SemanticError {\n'
              '    let result maybe identity ir.Failure be none; let cursor be names;\n'
              '    while cursor != none { let value be try register(program,owner,m.makeType(6,cursor.text),location); result=identity ir.Failure { valueType=value; next=result; }; cursor=cursor.next; } return result;\n'
              '}\n',
              'public function failures(program identity ir.Program, owner identity m.Module, names maybe identity m.Name, location identity m.Location, profile identity Profile) returns maybe identity ir.Failure fails m.SemanticError {\n'
              '    let result maybe identity ir.Failure be none; let cursor be names;\n'
              '    while cursor != none { let value be try register(program,owner,m.makeType(6,cursor.text),location,profile); result=identity ir.Failure { valueType=value; next=result; }; cursor=cursor.next; } return result;\n'
              '}\n')
          if 'public type Profile' not in s or 'registerSteps=profile.registerSteps+1' not in s:
              raise SystemExit('ir_types diagnostic patch failed')
          types_path.write_text(s)

          lower_path=Path('src/compiler/ir_lower.eri')
          s=lower_path.read_text()
          s=s.replace(
              'type Builder { program identity ir.Program; sources maybe identity Source; seen maybe identity Seen; count Int; }',
              'type Builder { program identity ir.Program; sources maybe identity Source; seen maybe identity Seen; count Int; profile identity ir_types.Profile; sourceLookups Int; sourceSteps Int; sourceHits Int; sourceMisses Int; bindingLookups Int; bindingSteps Int; sweepPasses Int; sweepSteps Int; }')
          s=s.replace(
              'let result be try ir_types.register(builder.program,owner,value,m.at(owner,source.token));',
              'let result be try ir_types.register(builder.program,owner,value,m.at(owner,source.token),builder.profile);')
          s=s.replace(
              'function binding(context identity Context, source identity ast.Node) returns identity ir.Local fails m.SemanticError {\n'
              '    let cursor be context.bindings;\n'
              '    while cursor != none { if cursor.name == source.text { return cursor.local; } cursor=cursor.next; }',
              'function binding(context identity Context, source identity ast.Node) returns identity ir.Local fails m.SemanticError {\n'
              '    context.builder.bindingLookups=context.builder.bindingLookups+1; let cursor be context.bindings;\n'
              '    while cursor != none { context.builder.bindingSteps=context.builder.bindingSteps+1; if cursor.name == source.text { return cursor.local; } cursor=cursor.next; }')
          s=s.replace(
              '    let cursor be builder.sources;\n'
              '    while cursor != none { if cursor.declaration == declaration and cursor.key == key { return cursor.routine; } cursor=cursor.next; }\n'
              '    let routine be identity ir.Function',
              '    builder.sourceLookups=builder.sourceLookups+1; let cursor be builder.sources;\n'
              '    while cursor != none { builder.sourceSteps=builder.sourceSteps+1; if cursor.declaration == declaration and cursor.key == key { builder.sourceHits=builder.sourceHits+1; return cursor.routine; } cursor=cursor.next; }\n'
              '    builder.sourceMisses=builder.sourceMisses+1; let routine be identity ir.Function')
          s=s.replace(
              'failures=try ir_types.failures(builder.program,owner,declaration.failures,m.at(owner,source.token));',
              'failures=try ir_types.failures(builder.program,owner,declaration.failures,m.at(owner,source.token),builder.profile);')
          s=s.replace(
              'result.effects=try ir_types.failures(context.builder.program,context.owner,info.failures,result.location);',
              'result.effects=try ir_types.failures(context.builder.program,context.owner,info.failures,result.location,context.builder.profile);')
          s=s.replace(
              'let typeId be try ir_types.register(context.builder.program,context.owner,errorType,result.location);',
              'let typeId be try ir_types.register(context.builder.program,context.owner,errorType,result.location,context.builder.profile);')
          s=s.replace(
              'expected=try ir_types.register(context.builder.program,context.owner,try semantic.typeRef(context.owner,annotation),result.location);',
              'expected=try ir_types.register(context.builder.program,context.owner,try semantic.typeRef(context.owner,annotation),result.location,context.builder.profile);')
          s=s.replace(
              '    let builder be identity Builder { program=program; sources=none; seen=none; count=0; };',
              '    let builder be identity Builder { program=program; sources=none; seen=none; count=0; profile=identity ir_types.Profile { registerCalls=0; registerSteps=0; registerHits=0; registerMisses=0; maxTypes=0; }; sourceLookups=0; sourceSteps=0; sourceHits=0; sourceMisses=0; bindingLookups=0; bindingSteps=0; sweepPasses=0; sweepSteps=0; };')
          s=s.replace(
              '    while pending {\n'
              '        pending=false; let cursor be builder.sources;\n'
              '        while cursor != none {\n'
              '            let current be cursor;',
              '    while pending {\n'
              '        builder.sweepPasses=builder.sweepPasses+1; pending=false; let cursor be builder.sources;\n'
              '        while cursor != none {\n'
              '            builder.sweepSteps=builder.sweepSteps+1; let current be cursor;')
          s=s.replace(
              '                if source.owner.trace { progress.phase(true,"end","lower-function","f"+format.integer(current.routine.index)+" "+current.routine.name); }\n'
              '            }',
              '                if source.owner.trace {\n'
              '                    progress.phase(true,"end","lower-function","f"+format.integer(current.routine.index)+" "+current.routine.name);\n'
              '                    progress.phase(true,"sample","lower-profile","f="+format.integer(current.routine.index)+" functions="+format.integer(builder.count)+" reg_calls="+format.integer(builder.profile.registerCalls)+" reg_steps="+format.integer(builder.profile.registerSteps)+" reg_hits="+format.integer(builder.profile.registerHits)+" reg_misses="+format.integer(builder.profile.registerMisses)+" max_types="+format.integer(builder.profile.maxTypes)+" src_lookups="+format.integer(builder.sourceLookups)+" src_steps="+format.integer(builder.sourceSteps)+" src_hits="+format.integer(builder.sourceHits)+" src_misses="+format.integer(builder.sourceMisses)+" bind_lookups="+format.integer(builder.bindingLookups)+" bind_steps="+format.integer(builder.bindingSteps)+" sweep_passes="+format.integer(builder.sweepPasses)+" sweep_steps="+format.integer(builder.sweepSteps));\n'
              '                }\n'
              '            }')
          required=['profile identity ir_types.Profile','sourceSteps=builder.sourceSteps+1','bindingSteps=context.builder.bindingSteps+1','"lower-profile"','sweepSteps=builder.sweepSteps+1']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('ir_lower diagnostic patch failed: '+repr(missing))
          lower_path.write_text(s)
          PY
          git diff --check
          git diff -- src/compiler/ir_types.eri src/compiler/ir_lower.eri > "$RUNNER_TEMP/lower-ir-diagnostic.patch"

      - name: Build diagnostic compiler B on bootstrap runtime
        shell: bash
        run: |
          set -o pipefail
          python -u tools/build_offline.py \
            --skip-self-build \
            --trace-phases \
            --command-timeout 300 \
            --output "$RUNNER_TEMP/erist-profile" \
            2>&1 | tee "$RUNNER_TEMP/profile-build.log"

      - name: Run full frozen compiler workload with counters
        id: profile
        shell: bash
        run: |
          set -u
          bundle="$RUNNER_TEMP/erist-profile"
          root="$RUNNER_TEMP/source-main"
          trace="$RUNNER_TEMP/profile.trace.log"
          timing="$RUNNER_TEMP/profile.time.txt"
          out="$RUNNER_TEMP/profile.partial.s"
          rcfile="$RUNNER_TEMP/profile.rc"
          set +e
          /usr/bin/time -v -o "$timing" \
            timeout --signal=TERM --kill-after=10s 180s \
            "$bundle/bin/erist-compiler" emit-asm "$root/frontend.eri" \
              --source-root "$root" --target x86_64-linux --trace-phases \
              > "$out" 2> "$trace"
          rc=$?
          set -e
          echo "$rc" > "$rcfile"
          grep '"phase":"lower-profile"' "$trace" > "$RUNNER_TEMP/lower-profile.samples" || true
          tail -n 1 "$RUNNER_TEMP/lower-profile.samples" > "$RUNNER_TEMP/lower-profile.final" || true
          echo "exit_code=$rc"
          cat "$RUNNER_TEMP/lower-profile.final" || true
          cat "$timing"

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lower-ir-counter-probe-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/source-main.sha256
            ${{ runner.temp }}/lower-ir-diagnostic.patch
            ${{ runner.temp }}/profile-build.log
            ${{ runner.temp }}/profile.trace.log
            ${{ runner.temp }}/profile.time.txt
            ${{ runner.temp }}/profile.rc
            ${{ runner.temp }}/profile.partial.s
            ${{ runner.temp }}/lower-profile.samples
            ${{ runner.temp }}/lower-profile.final
            ${{ runner.temp }}/erist-profile/self-build.json
            ${{ runner.temp }}/erist-profile/source-manifest.json
            ${{ runner.temp }}/erist-profile/evidence/

      - name: Classify counter probe
        if: always()
        shell: bash
        run: |
          rc=$(cat "$RUNNER_TEMP/profile.rc" 2>/dev/null || echo 999)
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "Unexpected diagnostic compiler exit: $rc" >&2
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/lower-profile.samples" ]; then
            echo 'No lower-profile samples captured' >&2
            exit 1
          fi
          echo "Counter probe captured $(wc -l < "$RUNNER_TEMP/lower-profile.samples") completed-function samples (rc=$rc)."
