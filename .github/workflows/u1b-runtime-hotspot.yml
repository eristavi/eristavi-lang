name: U1b linked runtime hotspot profile (opt-in)

# Diagnostic-only Linux x86-64 sampling. No full matrix or owned self-build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: u1b-runtime-hotspot-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  hotspot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CC: clang
      CFLAGS: -O2
      ERISTAVI_U1B_HOTSPOT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Full linked fixture, diagnostic runtime counters and stage wall-clock
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=tests python -u -m unittest -v test_u1b_runtime_hotspot 2>&1 | tee u1b-hotspot.log
      - name: Retain scoped profiler log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: u1b-hotspot-${{ github.run_attempt }}
          retention-days: 14
          path: u1b-hotspot.log
