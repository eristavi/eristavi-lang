name: U2 whole-Function existing Text List import integration
on:
  push:
    branches: [compiler/u2-cleanup-foundation-20261102]
    paths:
      - src/compiler/u2_function_native_imports.eri
      - src/compiler/u2_function_managed_x86_64.eri
      - src/compiler/u2_managed_root_gate.eri
      - tests/test_u2_function_import_integration.py
      - .github/workflows/u2-function-import-focused.yml
permissions:
  contents: read
concurrency:
  group: u2-function-import-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-import-integration:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install compiler bootstrap
        run: python -m pip install -e .
      - name: Check Python test and source syntax
        run: python -m compileall -q tests/test_u2_function_import_integration.py compiler
      - name: Run existing Text List originals through whole Function
        run: |
          set -o pipefail
          PYTHONPATH=tests python -u -m unittest -v test_u2_function_import_integration 2>&1 | tee "$RUNNER_TEMP/u2-function-imports.log"
      - name: Preserve focused integration logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: u2-function-import-${{ github.run_attempt }}
          retention-days: 14
          path: ${{ runner.temp }}/u2-function-imports.log
