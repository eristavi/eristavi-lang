name: Focused test_u3_shadow_gate qualification
on:
  push:
    branches:
      - compiler/u3-shadow-frontend-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bootstrap toolchain
        run: python -m pip install -e .
      - name: Run exact focused tests
        run: |
          python -m compileall -q compiler/erist/u3_shadow_gate.py tests/test_u3_shadow_gate.py
          PYTHONPATH=.:tests python -m unittest -v test_u3_shadow_gate test_u3_construction_pilot
