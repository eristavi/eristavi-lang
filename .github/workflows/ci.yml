name: Eristavi CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-24.04-arm
            cc: clang
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: -O2
      ERISTAVI_GRAPHEME_BREAK_TEST: /tmp/GraphemeBreakTest-17.0.0.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bootstrap toolchain
        run: python -m pip install -e .
      - name: Fetch pinned Unicode 17 grapheme conformance vectors
        run: >-
          curl --fail --location --retry 3
          https://raw.githubusercontent.com/starwing/luautf8/a47b1433473a2509d77ad28f59a976716d187927/GraphemeBreakTest.txt
          --output "$ERISTAVI_GRAPHEME_BREAK_TEST"
      - name: Compile Python sources
        run: python -m compileall -q compiler tests tools
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest' && matrix.cc == 'gcc'
        with:
          node-version: '22'
      - name: Package VS Code language extension
        if: matrix.os == 'ubuntu-latest' && matrix.cc == 'gcc'
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce@4.0.0 package --out "$RUNNER_TEMP/eristavi-language.vsix"
      - name: Verify native self-build and offline bundle
        if: runner.os == 'Linux'
        timeout-minutes: 45
        run: python tools/build_offline.py --output "$RUNNER_TEMP/erist-offline"
