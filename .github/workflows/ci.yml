name: Eristavi CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bootstrap toolchain
        run: |
          for attempt in 1 2 3; do
            python -m pip install -e . && break
            [ "$attempt" -lt 3 ] || exit 1
          done
      - name: Compile Python sources
        run: python -m compileall -q compiler tests tools
      - name: Run preflight before qualification
        env:
          QUALIFY: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: |
          if [ "$QUALIFY" = true ]; then
            python tools/preflight.py --qualify
          else
            python tools/preflight.py
          fi
  test:
    needs: preflight
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-24.04-arm
            cc: clang
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: -O2
      ERISTAVI_GRAPHEME_BREAK_TEST: /tmp/GraphemeBreakTest-17.0.0.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bootstrap toolchain
        run: |
          for attempt in 1 2 3; do
            python -m pip install -e . && break
            [ "$attempt" -lt 3 ] || exit 1
          done
      - name: Fetch pinned Unicode 17 grapheme conformance vectors
        run: >-
          curl --fail --location --retry 3
          https://raw.githubusercontent.com/starwing/luautf8/a47b1433473a2509d77ad28f59a976716d187927/GraphemeBreakTest.txt
          --output "$ERISTAVI_GRAPHEME_BREAK_TEST"
      - name: Compile Python sources
        run: python -m compileall -q compiler tests tools
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Verify native self-build and offline bundle
        if: runner.os == 'Linux'
        timeout-minutes: 45
        run: python tools/build_offline.py --output "$RUNNER_TEMP/erist-offline"
