name: Eristavi CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-24.04-arm
            cc: clang
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: -O2
      ERISTAVI_GRAPHEME_BREAK_TEST: /tmp/GraphemeBreakTest-17.0.0.txt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bootstrap toolchain
        run: python -m pip install -e .
      - name: Fetch pinned Unicode 17 grapheme conformance vectors
        run: >-
          curl --fail --location --retry 3
          https://raw.githubusercontent.com/starwing/luautf8/a47b1433473a2509d77ad28f59a976716d187927/GraphemeBreakTest.txt
          --output "$ERISTAVI_GRAPHEME_BREAK_TEST"
      - name: Compile Python sources
        run: python -m compileall -q compiler tests tools
      - name: Run test suite
        run: |
          set -o pipefail
          python -u tools/run_ci_tests.py --report "$RUNNER_TEMP/test-results.json" 2>&1 | tee "$RUNNER_TEMP/test-results.log"
      - name: Preserve test outcomes and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tests-${{ matrix.os }}-${{ matrix.cc }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/test-results.json
            ${{ runner.temp }}/test-results.log
