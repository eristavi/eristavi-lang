name: U1b word-store duplicate owner poll study (opt-in)
on:
  pull_request:
    paths:
      - tests/test_u1b_words_owner_poll_benchmark.py
      - .github/workflows/u1b-words-owner-poll.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: u1b-words-owner-poll-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CC: clang
      CFLAGS: -O2
      ERISTAVI_U1B_WORDS_POLL_PAIRS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Same-owned-runtime original/C oracle versus test-only word poll pilot
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=tests python -u -m unittest -v test_u1b_words_owner_poll_benchmark 2>&1 | tee u1b-word-poll.log
      - name: Retain paired raw outcome
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: u1b-word-poll-${{ github.run_attempt }}
          retention-days: 14
          path: u1b-word-poll.log
