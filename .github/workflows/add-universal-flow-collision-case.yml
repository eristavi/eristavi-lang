name: Add Universal verifier flow collision regression

on:
  push:
    branches: [compiler/index-universal-verifier-flows]

permissions:
  contents: write

jobs:
  collision-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CC: clang
      CFLAGS: -O2
      PYTHONPATH: tests:.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bootstrap toolchain
        run: python -m pip install -e .
      - name: Apply collision regression
        run: |
          set -euo pipefail
          python tools/add_universal_flow_collision_case.py
          git diff --check
          grep -q "bucket-collision" tests/universal_verifier_cases.py
      - name: Run focused verifier oracle on bootstrap and native paths
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_self_hosting_universal.SelfHostedUniversalTests.test_verifier_preserves_wide_cfg_diagnostics \
            tests.test_self_hosting_universal.SelfHostedUniversalTests.test_native_verifier_preserves_wide_cfg_diagnostics
      - name: Commit permanent test only
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/universal_verifier_cases.py
          git rm tools/add_universal_flow_collision_case.py .github/workflows/add-universal-flow-collision-case.yml
          git commit -m 'Cover Universal verifier flow-index collisions'
          git push
