name: Remaining lower IR counter diagnostic

on:
  push:
    branches: [diagnostics/lower-ir-remaining-f030a08]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bootstrap toolchain
        run: python -m pip install -e .
      - name: Freeze exact source workload
        run: |
          set -euo pipefail
          cp -a src "$RUNNER_TEMP/source-main"
          (cd "$RUNNER_TEMP/source-main" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/source-main.sha256"
      - name: Build control compiler and reference output
        run: |
          set -euo pipefail
          python -u tools/build_offline.py --skip-self-build --command-timeout 300 --output "$RUNNER_TEMP/erist-control" > "$RUNNER_TEMP/control-build.log" 2>&1
          timeout 60s "$RUNNER_TEMP/erist-control/bin/erist-compiler" emit-asm "$RUNNER_TEMP/source-main/frontend.eri" --source-root "$RUNNER_TEMP/source-main" --target x86_64-linux > "$RUNNER_TEMP/control.s" 2> "$RUNNER_TEMP/control.trace.log"
      - name: Apply diagnostic counters
        run: |
          set -euo pipefail
          python tools/lower_ir_remaining_probe_patch.py
          git diff --check
          git diff -- src/compiler/ir_lower.eri > "$RUNNER_TEMP/lower-ir-remaining.patch"
      - name: Build diagnostic compiler
        run: |
          set -euo pipefail
          python -u tools/build_offline.py --skip-self-build --trace-phases --command-timeout 300 --output "$RUNNER_TEMP/erist-profile" > "$RUNNER_TEMP/profile-build.log" 2>&1
      - name: Run full frozen workload with counters
        run: |
          set -u
          set +e
          /usr/bin/time -v -o "$RUNNER_TEMP/profile.time.txt" timeout --signal=TERM --kill-after=10s 180s "$RUNNER_TEMP/erist-profile/bin/erist-compiler" emit-asm "$RUNNER_TEMP/source-main/frontend.eri" --source-root "$RUNNER_TEMP/source-main" --target x86_64-linux --trace-phases > "$RUNNER_TEMP/profile.s" 2> "$RUNNER_TEMP/profile.trace.log"
          rc=$?
          set -e
          echo "$rc" > "$RUNNER_TEMP/profile.rc"
          grep '"phase":"lower-profile"' "$RUNNER_TEMP/profile.trace.log" > "$RUNNER_TEMP/lower-profile.samples" || true
          tail -n 1 "$RUNNER_TEMP/lower-profile.samples" > "$RUNNER_TEMP/lower-profile.final" || true
          if [ "$rc" -eq 0 ]; then
            cmp "$RUNNER_TEMP/control.s" "$RUNNER_TEMP/profile.s"
            sha256sum "$RUNNER_TEMP/control.s" "$RUNNER_TEMP/profile.s" > "$RUNNER_TEMP/output.sha256"
          fi
          echo "exit_code=$rc"
          cat "$RUNNER_TEMP/lower-profile.final" || true
          cat "$RUNNER_TEMP/profile.time.txt"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lower-ir-remaining-probe-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/source-main.sha256
            ${{ runner.temp }}/lower-ir-remaining.patch
            ${{ runner.temp }}/control-build.log
            ${{ runner.temp }}/control.trace.log
            ${{ runner.temp }}/control.s
            ${{ runner.temp }}/profile-build.log
            ${{ runner.temp }}/profile.trace.log
            ${{ runner.temp }}/profile.time.txt
            ${{ runner.temp }}/profile.rc
            ${{ runner.temp }}/profile.s
            ${{ runner.temp }}/lower-profile.samples
            ${{ runner.temp }}/lower-profile.final
            ${{ runner.temp }}/output.sha256
      - name: Classify counter probe
        if: always()
        run: |
          rc=$(cat "$RUNNER_TEMP/profile.rc" 2>/dev/null || echo 999)
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit 1; fi
          test -s "$RUNNER_TEMP/lower-profile.samples"
          if [ "$rc" -eq 0 ]; then cmp -s "$RUNNER_TEMP/control.s" "$RUNNER_TEMP/profile.s"; fi
          echo "captured $(wc -l < "$RUNNER_TEMP/lower-profile.samples") samples rc=$rc"
