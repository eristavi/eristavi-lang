name: Type registration index candidate

on:
  push:
    branches:
      - compiler/type-registration-index

permissions:
  contents: write

concurrency:
  group: type-registration-index-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CC: clang
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install bootstrap toolchain
        run: python -m pip install -e .

      - name: Build unmodified baseline frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          from compiler.erist.cli import build_native
          rc=build_native(Path('src/frontend.eri'),Path('/tmp/erist-baseline'),Path('src'))
          raise SystemExit(rc)
          PY

      - name: Apply compiler-private type registration index
        run: |
          python - <<'PY'
          from pathlib import Path

          types_path=Path('src/compiler/ir_types.eri')
          text=types_path.read_text()
          start=text.index('public function register(')
          end=text.index('public function semanticType(',start)
          replacement=r'''// Compiler-private lookup state. Program.types remains the canonical public table.
          public type TypeCacheEntry { kind Int; name Text; inner Int; index Int; next maybe identity TypeCacheEntry; }
          public type TypeBucket { number Int; entries maybe identity TypeCacheEntry; left maybe identity TypeBucket; right maybe identity TypeBucket; }
          public type Registry { root identity TypeBucket; nextIndex Int; }

          function bucketTree(first Int, last Int) returns maybe identity TypeBucket {
              if first > last { return none; }
              let middle be first+(last-first)/2;
              return identity TypeBucket { number=middle; entries=none; left=bucketTree(first,middle-1); right=bucketTree(middle+1,last); };
          }
          function typeBucket(indexer identity Registry, number Int) returns identity TypeBucket {
              let cursor maybe identity TypeBucket be indexer.root;
              while cursor != none {
                  let current be cursor;
                  if current.number == number { return current; }
                  if number < current.number { cursor=current.left; } else { cursor=current.right; }
              }
              return indexer.root;
          }
          function typeHash(kind Int, name Text, inner Int) returns Int {
              let value be kind%257; if value < 0 { value=value+257; }
              let part be inner%257; if part < 0 { part=part+257; }
              value=(value*131+part)%257;
              let offset be 0;
              while offset < name.bytes.count { value=(value*131+name.bytes[offset])%257; offset=offset+1; }
              return value;
          }
          function cached(indexer identity Registry, kind Int, name Text, inner Int) returns Int {
              let slot be typeBucket(indexer,typeHash(kind,name,inner)); let cursor be slot.entries;
              while cursor != none { if cursor.kind == kind and cursor.name == name and cursor.inner == inner { return cursor.index; } cursor=cursor.next; }
              return -1;
          }
          function remember(indexer identity Registry, kind Int, name Text, inner Int, index Int) {
              let slot be typeBucket(indexer,typeHash(kind,name,inner));
              slot.entries=identity TypeCacheEntry { kind=kind; name=name; inner=inner; index=index; next=slot.entries; };
          }
          function seed(indexer identity Registry, value maybe identity ir.Type) {
              if value != none { seed(indexer,value.next); remember(indexer,value.kind,value.name,value.inner,value.index); indexer.nextIndex=indexer.nextIndex+1; }
          }
          public function registry(program identity ir.Program) returns identity Registry {
              let result be identity Registry {
                  root=identity TypeBucket { number=128; entries=none; left=bucketTree(0,127); right=bucketTree(129,256); };
                  nextIndex=6;
              };
              seed(result,program.types); return result;
          }
          function registerWith(indexer maybe identity Registry, program identity ir.Program, owner identity m.Module, value identity m.Type, location identity m.Location) returns Int fails m.SemanticError {
              let actual be t.resolve(value); let kind be actual.kind;
              if kind >= 1 and kind <= 5 { return kind; }
              if kind == 0 { try m.reject(location,"lower","unresolved type in executable lowering"); }
              let inner be -1;
              if kind == 7 or kind == 8 or kind == 9 { inner=try registerWith(indexer,program,owner,t.inner(actual),location); }
              let index be -1;
              if indexer != none {
                  index=cached(indexer,kind,actual.name,inner); if index >= 0 { return index; }
                  index=indexer.nextIndex; indexer.nextIndex=index+1;
              } else {
                  let cursor be program.types; index=6;
                  while cursor != none { if cursor.kind == kind and cursor.name == actual.name and cursor.inner == inner { return cursor.index; } index=index+1; cursor=cursor.next; }
              }
              let item be identity ir.Type { index=index; kind=kind; name=actual.name; inner=inner; fields=none; checked=false; next=program.types; }; program.types=item;
              if indexer != none { remember(indexer,kind,actual.name,inner,index); }
              if kind == 6 {
                  if actual.name == "std.files.FileError" { item.checked=true;
                      item.fields=identity ir.Field { index=0; name="message"; valueType=4; immutable=false; next=identity ir.Field { index=1; name="path"; valueType=4; immutable=false; next=none; }; }; return index;
                  }
                  let declaration be semantic.layout(owner,actual.name);
                  if declaration == none { try m.reject(location,"lower","missing nominal type layout: "+actual.name); }
                  else {
                      item.checked=declaration.node.kind == 5;
                      let field be declaration.fields; let number be 0; let tail maybe identity ir.Field be none;
                      while field != none {
                          let fieldType be try registerWith(indexer,program,owner,field.value,location);
                          let entry be identity ir.Field { index=number; name=field.name; valueType=fieldType; immutable=field.immutable; next=none; };
                          if tail == none { item.fields=entry; } else { tail.next=entry; } tail=entry; number=number+1; field=field.next;
                      }
                  }
              }
              if kind == 11 { item.fields=identity ir.Field { index=0; name="message"; valueType=4; immutable=false; next=none; }; }
              return index;
          }
          public function register(program identity ir.Program, owner identity m.Module, value identity m.Type, location identity m.Location) returns Int fails m.SemanticError {
              return try registerWith(none,program,owner,value,location);
          }
          public function registerIndexed(indexer identity Registry, program identity ir.Program, owner identity m.Module, value identity m.Type, location identity m.Location) returns Int fails m.SemanticError {
              return try registerWith(indexer,program,owner,value,location);
          }
          '''
          text=text[:start]+replacement+text[end:]
          failure_start=text.index('public function failures(')
          failure_end=text.index('public function field(',failure_start)
          failure_replacement=r'''function failureSet(indexer maybe identity Registry, program identity ir.Program, owner identity m.Module, names maybe identity m.Name, location identity m.Location) returns maybe identity ir.Failure fails m.SemanticError {
              let result maybe identity ir.Failure be none; let cursor be names;
              while cursor != none { let value be try registerWith(indexer,program,owner,m.makeType(6,cursor.text),location); result=identity ir.Failure { valueType=value; next=result; }; cursor=cursor.next; } return result;
          }
          public function failures(program identity ir.Program, owner identity m.Module, names maybe identity m.Name, location identity m.Location) returns maybe identity ir.Failure fails m.SemanticError {
              return try failureSet(none,program,owner,names,location);
          }
          public function failuresIndexed(indexer identity Registry, program identity ir.Program, owner identity m.Module, names maybe identity m.Name, location identity m.Location) returns maybe identity ir.Failure fails m.SemanticError {
              return try failureSet(indexer,program,owner,names,location);
          }
          '''
          text=text[:failure_start]+failure_replacement+text[failure_end:]
          types_path.write_text(text)

          lower_path=Path('src/compiler/ir_lower.eri')
          lower=lower_path.read_text()
          replacements=[
              ('type Builder { program identity ir.Program; sources maybe identity Source; seen maybe identity Seen; count Int; }',
               'type Builder { program identity ir.Program; typeRegistry identity ir_types.Registry; sources maybe identity Source; seen maybe identity Seen; count Int; }'),
              ('let result be try ir_types.register(builder.program,owner,value,m.at(owner,source.token));',
               'let result be try ir_types.registerIndexed(builder.typeRegistry,builder.program,owner,value,m.at(owner,source.token));'),
              ('failures=try ir_types.failures(builder.program,owner,declaration.failures,m.at(owner,source.token));',
               'failures=try ir_types.failuresIndexed(builder.typeRegistry,builder.program,owner,declaration.failures,m.at(owner,source.token));'),
              ('result.effects=try ir_types.failures(context.builder.program,context.owner,info.failures,result.location);',
               'result.effects=try ir_types.failuresIndexed(context.builder.typeRegistry,context.builder.program,context.owner,info.failures,result.location);'),
              ('ir_types.register(context.builder.program,context.owner,errorType,result.location)',
               'ir_types.registerIndexed(context.builder.typeRegistry,context.builder.program,context.owner,errorType,result.location)'),
              ('ir_types.register(context.builder.program,context.owner,try semantic.typeRef(context.owner,annotation),result.location)',
               'ir_types.registerIndexed(context.builder.typeRegistry,context.builder.program,context.owner,try semantic.typeRef(context.owner,annotation),result.location)'),
              ('let builder be identity Builder { program=program; sources=none; seen=none; count=0; };',
               'let builder be identity Builder { program=program; typeRegistry=ir_types.registry(program); sources=none; seen=none; count=0; };'),
          ]
          for old,new in replacements:
              count=lower.count(old)
              if count != 1:
                  raise SystemExit(f'expected one lowering replacement, found {count}: {old}')
              lower=lower.replace(old,new,1)
          lower_path.write_text(lower)
          PY

      - name: Build indexed candidate frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          from compiler.erist.cli import build_native
          rc=build_native(Path('src/frontend.eri'),Path('/tmp/erist-candidate'),Path('src'))
          raise SystemExit(rc)
          PY

      - name: Compare focused structural output exactly
        run: |
          set -euo pipefail
          timeout 90s /tmp/erist-baseline ir src/compiler/typed_ir.eri --source-root src > /tmp/base-ir.json 2>/tmp/base-ir.err
          timeout 90s /tmp/erist-candidate ir src/compiler/typed_ir.eri --source-root src > /tmp/candidate-ir.json 2>/tmp/candidate-ir.err
          test ! -s /tmp/base-ir.err
          test ! -s /tmp/candidate-ir.err
          cmp /tmp/base-ir.json /tmp/candidate-ir.json
          timeout 90s /tmp/erist-baseline emit-asm src/compiler/typed_ir.eri --source-root src --target x86_64-linux > /tmp/base-typed.s 2>/tmp/base-typed.err
          timeout 90s /tmp/erist-candidate emit-asm src/compiler/typed_ir.eri --source-root src --target x86_64-linux > /tmp/candidate-typed.s 2>/tmp/candidate-typed.err
          test ! -s /tmp/base-typed.err
          test ! -s /tmp/candidate-typed.err
          cmp /tmp/base-typed.s /tmp/candidate-typed.s
          sha256sum /tmp/base-ir.json /tmp/base-typed.s | tee /tmp/focused-hashes.txt

      - name: Run focused lowering regressions
        run: |
          PYTHONPATH="tests:." python -m unittest -v \
            test_self_hosting_ir.SelfHostedIRTests.test_ir_is_typed_located_and_deterministic \
            test_self_hosting_ir.SelfHostedIRTests.test_specializations_are_concrete_cached_and_deterministic

      - name: Run one bounded full-source A/B pair
        shell: bash
        run: |
          set -u
          run_one() {
            label="$1"; binary="$2"; out="/tmp/${label}-frontend.s"; err="/tmp/${label}-frontend.err"; timing="/tmp/${label}-frontend.time"
            set +e
            /usr/bin/time -f 'wall=%e\nuser=%U\nsystem=%S\nmax_rss_kib=%M' -o "$timing" \
              timeout --signal=TERM --kill-after=5s 180s "$binary" emit-asm src/frontend.eri --source-root src --target x86_64-linux >"$out" 2>"$err"
            rc=$?
            set -e
            printf '%s\n' "$rc" > "/tmp/${label}-frontend.rc"
            echo "$label rc=$rc"
            cat "$timing"
            return 0
          }
          run_one baseline /tmp/erist-baseline
          run_one candidate /tmp/erist-candidate
          base_rc=$(cat /tmp/baseline-frontend.rc)
          candidate_rc=$(cat /tmp/candidate-frontend.rc)
          if [ "$candidate_rc" -ne 0 ]; then
            echo "candidate did not complete within the bounded comparison" >&2
            exit 1
          fi
          if [ "$base_rc" -eq 0 ]; then
            cmp /tmp/baseline-frontend.s /tmp/candidate-frontend.s
            sha256sum /tmp/baseline-frontend.s /tmp/candidate-frontend.s | tee /tmp/full-hashes.txt
          else
            echo "baseline bounded result rc=$base_rc; focused exact-output parity remains the correctness oracle" | tee /tmp/full-hashes.txt
          fi
          test ! -s /tmp/candidate-frontend.err

      - name: Preserve candidate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: type-registration-index-candidate-${{ github.run_attempt }}
          retention-days: 14
          path: |
            /tmp/focused-hashes.txt
            /tmp/full-hashes.txt
            /tmp/base-ir.json
            /tmp/candidate-ir.json
            /tmp/base-typed.s
            /tmp/candidate-typed.s
            /tmp/baseline-frontend.time
            /tmp/candidate-frontend.time
            /tmp/baseline-frontend.rc
            /tmp/candidate-frontend.rc
            /tmp/baseline-frontend.err
            /tmp/candidate-frontend.err
            /tmp/baseline-frontend.s
            /tmp/candidate-frontend.s

      - name: Commit validated candidate source
        run: |
          git diff --check
          git add src/compiler/ir_types.eri src/compiler/ir_lower.eri
          git config user.name 'Revaz Eristavi'
          git config user.email 'eristavi@gmail.com'
          git commit -m 'Index typed IR type registration [type-index-candidate-applied]'
          git push origin HEAD:compiler/type-registration-index
